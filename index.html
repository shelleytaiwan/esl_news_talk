    <!-- Script Logic -->
    <script>
        const masterNewsPool = [
            {
                id: 1,
                source: "Source: BBC News",
                cardTitle: "研究發現烏鴉具備抽象的「零」概念",
                cardDesc: "科學研究帶來驚奇突破：聰明的鳥類烏鴉竟然能在大腦中完美掌握並理解抽象的「零」與「無」。實驗顯示烏鴉大腦神經元會針對空白集合產生特定放電反應，證明高等數學概念並非人類專美於前。",
                title: "Crows Understand the Abstract Concept of 'Zero', Study Finds",
                badge: "BBC 科學新發現",
                body: `<p>For a long time, people thought only humans and some primates could understand the concept of zero. However, a fascinating new study reveals that crows can also grasp this abstract idea.</p><p>Scientists trained crows to respond when they saw sets of dots with different numbers, including empty sets representing zero. The birds' brain cells fired in a specific way, proving they understood that zero is a real numerical value.</p>`,
                vocab: [
                    { en: "abstract", kk: "/ˈæb.strækt/", zh: "抽象的", jp: "抽象的な", usage: "An abstract idea exists as a thought or concept rather than a physical object.", ex: "The concept of time is quite abstract for young children." },
                    { en: "grasp", kk: "/ɡræsp/", zh: "理解、抓緊", jp: "理解する", usage: "To grasp something means to completely understand a complex concept or idea.", ex: "It took me a while to grasp the main idea of the article." },
                    { en: "numerical", kk: "/nuːˈmer.ɪ.kəl/", zh: "數值的", jp: "数値の", usage: "Relating to or expressed as numbers rather than words.", ex: "Please enter the numerical code to unlock the device." }
                ],
                allQuestions: [
                    { q: "Are you surprised that birds like crows can understand math concepts like zero?", ans: "Yes, I find it absolutely fascinating that birds like crows can grasp abstract numerical concepts despite having relatively small brains. In the past, people assumed high-level mathematical reasoning was unique to humans and primates. This breakthrough research completely reshapes our understanding of animal intelligence and evolutionary cognition." },
                    { q: "What other animals do you think might understand numbers or math?", ans: "Dolphins, chimpanzees, and elephants are top candidates because they already display extraordinary problem-solving abilities and complex communication skills. For example, dolphins can follow precise counting cues in marine biology studies. Furthermore, African grey parrots have demonstrated clear numerical comprehension in long-term cognitive experiments." },
                    { q: "Why is studying animal intelligence important for science?", ans: "Studying animal intelligence allows neuroscientists to trace the evolutionary origins of human thought and brain architecture. By observing how different species process abstract information, researchers can identify common neural pathways that enable logical reasoning. Ultimately, these insights deepen our respect for the natural world and advance biological science." },
                    { q: "Do you have any experience interacting with smart birds like parrots or crows?", ans: "Yes, I once visited an avian wildlife center where a trained parrot demonstrated incredible problem-solving skills to fetch food rewards. The bird could pick open miniature puzzle locks and repeat clear human sentences in context. Experiencing that firsthand proved to me how observant and clever birds truly are." },
                    { q: "If animals can understand math, does that change how we treat them?", ans: "It definitely forces society to reconsider our ethical obligations toward non-human animals and wildlife conservation. Recognizing that birds and mammals experience high-level cognition means we should minimize animal testing and protect their habitats from human destruction. Ethical laws should adapt to reflect these groundbreaking neuroscientific findings." },
                    { q: "What was the most surprising animal fact you learned recently?", ans: "I was astonished to learn that octopuses actually possess three hearts and nine separate brains that allow their arms to act independently. They can navigate intricate underwater mazes and disguise themselves by changing skin textures in milliseconds. Learning this made me realize that marine life holds endless evolutionary wonders." },
                    { q: "How would you explain the concept of 'zero' to a young child?", ans: "I would start by using hands-on visual props like a cookie jar filled with delicious snacks. After giving away every single cookie, I would show the child the empty jar to explain that zero represents the complete absence of items. Connecting the abstract mathematical symbol to a tangible daily experience makes it much easier to digest." },
                    { q: "Do you think science fiction movies underestimate or overestimate animal intelligence?", ans: "Most popular sci-fi movies tend to overestimate animal intelligence by depicting them talking fluent human languages or plotting complex world revolutions. While animals are certainly clever in their natural environments, Hollywood often anthropomorphizes them for dramatic entertainment. Real biological intelligence is far more subtle, specialized, and grounded in survival." },
                    { q: "If you could communicate with one animal for a day, which would it be?", ans: "I would choose to communicate with a humpback whale because they travel across global oceans and sing intricate underwater songs. Asking them about deep-sea mysteries and their migration journeys would be an unforgettable privilege. It would offer a truly unique perspective on marine ecosystems that humans rarely witness." },
                    { q: "What skills do humans have that animals can never replicate?", ans: "Humans possess the unique ability to create abstract written literature, formal philosophy, and complex technological infrastructure. While animals communicate through instincts and signals, they cannot archive knowledge in books or pass down history across centuries. Our capacity for cumulative cultural progress remains our most distinct human trait." }
                ]
            },
            {
                id: 6,
                source: "Source: Smithsonian Magazine",
                cardTitle: "考古重大發現：義大利古城出土保存完好的神祕羅馬壁畫",
                cardDesc: "考古學家在龐貝古城鄰近地區發掘出一間色彩鮮豔、保存極為完好的宴會廳，壁畫描繪了希臘神話中的英雄傳奇。這項發現讓歷史學家得以一窺當時的文化與藝術高度。",
                title: "Stunning Roman Banquet Hall Discovered in Pompeii Excavation",
                badge: "Smithsonian 歷史人文",
                body: `<p>Archaeologists working near Pompeii have uncovered a remarkably well-preserved banquet hall featuring stunning black-painted walls adorned with mythological frescoes.</p><p>The room offers rare insights into elite social life and artistic tastes during the ancient Roman period, leaving researchers amazed by the vivid colors.</p>`,
                vocab: [
                    { en: "excavation", kk: "/ˌek.skəˈveɪ.ʃən/", zh: "發掘、挖掘", jp: "発掘", usage: "The act of digging in the ground to uncover ancient ruins or artifacts.", ex: "The excavation site yielded many ancient pottery fragments." },
                    { en: "mythological", kk: "/ˌmɪθ.əˈlɑː.dʒɪ.kəl/", zh: "神話的", jp: "神話の", usage: "Relating to traditional stories about gods, heroes, or ancient legends.", ex: "The book is filled with ancient mythological creatures." },
                    { en: "vivid", kk: "/ˈvɪv.ɪd/", zh: "鮮明的、生動的", jp: "鮮やかな", usage: "Producing powerful, detailed, and bright mental images or colors.", ex: "She painted the walls with vivid blue and gold colors." }
                ],
                allQuestions: [
                    { q: "Would you like to visit an active archaeological excavation site?", ans: "Visiting an active archaeological site in person would be an absolute dream come true for me. Seeing team members carefully brush away layers of volcanic ash to reveal untouched ancient artwork creates an unbeatable sense of wonder. It bridges the gap between historical textbooks and real human history." },
                    { q: "Why do ancient civilizations like Pompeii capture our curiosity?", ans: "Pompeii captures public imagination because its tragic destruction instantly preserved a exact snapshot of everyday Roman life. Unlike other historical sites that decayed gradually over centuries, Pompeii was frozen in time under volcanic ash. Exploring its preserved streets allows us to empathize directly with people who lived two thousand years ago." },
                    { q: "What ancient culture do you find most interesting to study?", ans: "I am deeply fascinated by Ancient Egyptian culture because of their monument building, medical knowledge, and complex spiritual beliefs regarding the afterlife. Their majestic pyramids and detailed hieroglyphic records reveal an extraordinarily organized society. Studying their artwork always brings up thrilling new historical mysteries." },
                    { q: "How does archaeology help us understand modern human behavior?", ans: "Archaeology reveals patterns of urban growth, environmental adaptation, and societal collapse that remain relevant to modern cities today. By examining past waste, trade routes, and housing designs, historians learn how ancient communities solved systemic crises. These historical lessons help us make smarter decisions for our own future." },
                    { q: "Do you prefer visiting art museums or historical museums?", ans: "I personally prefer historical museums because everyday artifacts tell rich stories about ordinary human lives across generations. While fine art galleries celebrate individual creative genius, historical exhibits display tools, coins, and clothing that reveal entire social structures. It feels like stepping into a time machine." },
                    { q: "If you could travel to any historical era for one day, when would it be?", ans: "I would choose to visit Florence, Italy during the height of the Renaissance period in the 15th century. Witnessing legendary masters like Leonardo da Vinci and Michelangelo at work in their workshops would be breathtaking. It was an iconic era of scientific rediscovery and unprecedented artistic creation." },
                    { q: "How has modern technology improved archaeological discoveries?", ans: "Modern technology like satellite imaging, ground-penetrating radar, and 3D laser scanning allows archaeologists to map underground ruins without physically digging. Drone aerial photography can spot hidden road networks beneath dense forests in minutes. These non-invasive digital tools protect fragile historical structures while accelerating discovery." },
                    { q: "What is the oldest historical item you own or have seen?", ans: "The oldest item I have ever seen in person was a set of 4,000-year-old Mesopotamian clay tablets at a national museum. Seeing ancient cuneiform handwriting carved by an accountant thousands of years ago felt surreal. It made me realize that human desire to record information has remained unchanged since ancient times." },
                    { q: "Do you think governments spend enough money on cultural preservation?", ans: "In my opinion, many national governments underfund cultural preservation because they prioritize short-term economic projects over historical heritage. Without proper funding, precious archaeological sites suffer from erosion, tourism overcrowding, and looting. Investing in historical preservation protects irreplaceable human legacy for generations to come." },
                    { q: "What lesson can modern cities learn from ancient urban planning?", ans: "Modern city planners can learn a great deal from ancient Roman sanitation systems, public baths, and walkable central plazas. Ancient cities prioritized central gathering spaces that fostered strong community bonds and daily civic engagement. Incorporating similar pedestrian-friendly public spaces can make modern urban living healthier and more connected." }
                ]
            },
            {
                id: 19,
                source: "Source: NHK WORLD-JAPAN",
                cardTitle: "日本傳統工藝結合現代設計，拯救瀕臨失傳的職人技術",
                cardDesc: "面對現代化大量生產的衝擊，日本京都與金澤的年輕一代工藝師將傳統陶器與漆器結合現代簡約美學，推出大受歡迎的日常配件，成功讓瀕臨失傳的老手藝重獲新生。",
                title: "Japanese Artisans Revive Traditional Crafts with Modern Designs",
                badge: "NHK 日本工藝美學",
                body: `<p>Facing competition from mass manufacturing, young artisans in Kyoto and Kanazawa are combining traditional pottery and lacquerware with modern minimalist aesthetics to create popular everyday accessories.</p><p>This successful revival has breathed new life into endangered traditional crafts, attracting younger buyers worldwide.</p>`,
                vocab: [
                    { en: "artisan", kk: "/ˈɑːr.t̬ə.zən/", zh: "工匠、職人", jp: "職人", usage: "A skilled manual worker who crafts items with traditional methods by hand.", ex: "The artisan spent weeks handcrafting the ceramic teapot." },
                    { en: "minimalist", kk: "/ˈmɪn.ə.məl.ɪst/", zh: "極簡主義的", jp: "ミニマリストの", usage: "A design style that uses simple shapes, neutral colors, and basic elements.", ex: "She prefers a minimalist interior design with neutral colors." },
                    { en: "endanger", kk: "/ɪnˈdeɪn.dʒɚ/", zh: "使危及、瀕臨", jp: "危険にさらす", usage: "To put something in a situation where it might be harmed or cease to exist.", ex: "Pollution and poaching endanger many rare wildlife species." }
                ],
                allQuestions: [
                    { q: "Do you appreciate handmade artisan products over mass-produced goods?", ans: "Yes, I greatly prefer handcrafted artisan products because every single piece contains unique character and personal dedication from the maker. Mass-produced items often feel soulless and identical, whereas handmade ceramics or woodwork tell a rich story. Furthermore, purchasing artisan goods directly supports local craftsmen and traditional heritage." },
                    { q: "What traditional craft from your country or culture do you admire most?", ans: "I deeply admire traditional wood carving and ceramic tea set crafting because of the delicate techniques required to perfect them. Master artisans spend decades learning how to balance clay moisture, kiln temperature, and natural glazes. The finished teaware is not only functional for tea ceremonies but also represents timeless cultural elegance." },
                    { q: "How can modern design help preserve ancient cultural traditions?", ans: "Modern design breathes fresh relevance into traditional crafts by adapting ancient materials into functional items for modern lifestyles. For example, applying traditional lacquerware coating to daily smartphone cases or modern dining tables makes heritage techniques accessible to youth. By blending aesthetic minimalism with master craftsmanship, old traditions survive market changes." },
                    { q: "Have you ever tried pottery making or craft workshops?", ans: "Yes, I attended a ceramic pottery workshop last year where I learned how to throw clay on a rotating wheel. Shaping wet clay required immense focus, patience, and hand control, which gave me tremendous respect for professional potters. Taking home my fired ceramic bowl was an incredibly satisfying and memorable creative achievement." },
                    { q: "What is your favorite piece of home decor?", ans: "My favorite piece of decor is a handcrafted wooden desk lamp that I acquired from a local design fair. Its warm natural timber finish creates a peaceful, cozy atmosphere in my study every evening. Whenever I sit down to work, the soft illumination helps me focus and feel relaxed." },
                    { q: "Why do people value authenticity in products nowadays?", ans: "In our digital age of mass production and plastic goods, people crave genuine human connection and real material quality. Authentic handmade items feel durable, unique, and environmentally responsible compared to disposable fast-fashion products. Consumers want to invest in items that hold lasting value and meaningful craftsmanship." },
                    { q: "How do you support local artists and craftsmen?", ans: "I support local artists by visiting weekend craft markets, purchasing original gifts, and sharing their artwork on social media platforms. Recommending independent shops to friends helps small creative studios gain visibility in competitive online markets. Direct financial support ensures that independent talent can thrive sustainably in local communities." },
                    { q: "What city in the world has the most inspiring art and design scene?", ans: "Kyoto stands out as one of the most inspiring design capitals because it seamlessly blends ancient historic temples with cutting-edge Japanese aesthetics. Walking through traditional wooden neighborhoods reveals tiny artisan workshops alongside modern architecture. The city honors its cultural roots while constantly embracing creative contemporary design." },
                    { q: "Do you think traditional skills will survive in the digital age?", ans: "I am confident that traditional skills will survive as long as artisans adapt their marketing to global audiences through social media and e-commerce. Young consumers are increasingly seeking sustainable, slow-crafted alternatives to plastic factory goods. Digital platforms actually allow rural master craftsmen to sell directly to art lovers worldwide." },
                    { q: "If you could learn any traditional craft, what would it be?", ans: "If I had the opportunity, I would love to learn traditional Japanese woodworking known as Kumiko, which creates intricate wooden lattices without nails. Mastering precision joinery requires extraordinary discipline and mathematical patience. Creating beautiful geometric furniture using purely natural timber would be a deeply rewarding lifelong skill." }
                ]
            }
        ];

        let currentNewsId = null;
        let currentQuestionStartIndex = 0;
        let activeCardIndices = [];

        function getRandomIndices(max, count) {
            let indices = [];
            while(indices.length < count && indices.length < max) {
                let r = Math.floor(Math.random() * max);
                if(indices.indexOf(r) === -1) indices.push(r);
            }
            return indices;
        }

        // 渲染主頁新聞卡片 (含 LocalStorage 卡片記憶)
        function renderNewsCards(forceNew = false) {
            const container = document.getElementById('news-cards-container');
            if (!container) return;
            container.innerHTML = '';
            
            if (forceNew || !localStorage.getItem('activeCardIndices')) {
                activeCardIndices = getRandomIndices(masterNewsPool.length, 3);
                localStorage.setItem('activeCardIndices', JSON.stringify(activeCardIndices));
            } else {
                activeCardIndices = JSON.parse(localStorage.getItem('activeCardIndices'));
            }
            
            activeCardIndices.forEach((poolIdx, idx) => {
                const item = masterNewsPool[poolIdx];
                if (!item) return;
                const card = document.createElement('div');
                card.className = "bg-white rounded-2xl p-6 border border-slate-200 shadow-sm hover:shadow-md hover:border-indigo-300 transition cursor-pointer flex flex-col justify-between";
                card.onclick = () => selectNews(item.id);
                card.innerHTML = `
                    <div>
                        <div class="flex items-center justify-between mb-3">
                            <span class="text-xs font-semibold text-indigo-600 bg-indigo-50 px-2.5 py-1 rounded-md">精選新聞 #${idx + 1}</span>
                            <span class="text-xs text-slate-400">${item.source}</span>
                        </div>
                        <h3 class="font-bold text-lg text-slate-800 mb-2">${item.cardTitle}</h3>
                        <p class="text-sm text-slate-600 leading-relaxed" style="text-align: justify;">${item.cardDesc}</p>
                    </div>
                    <div class="mt-6 pt-4 border-t border-slate-100 flex items-center justify-between text-sm font-medium text-indigo-600">
                        <span>進入英文原文與討論</span>
                        <i class="fa-solid fa-arrow-right ml-2"></i>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function refreshNewsPool(event) {
            renderNewsCards(true);
            const btn = event ? event.currentTarget : document.querySelector('button[onclick*="refreshNewsPool"]');
            if (btn) {
                const originalHTML = btn.innerHTML;
                btn.innerHTML = `<i class="fa-solid fa-check" style="color: #059669;"></i><span style="color: #059669;">已換新！</span>`;
                setTimeout(() => { btn.innerHTML = originalHTML; }, 1500);
            }
        }

        function getActiveNewsData(id) {
            return masterNewsPool.find(n => n.id === id) || masterNewsPool[0];
        }

        // 選擇新聞 (含 LocalStorage 開機畫面記憶 + 渲染 KK 音標與英文用法)
        function selectNews(id) {
            currentNewsId = id;
            currentQuestionStartIndex = 0;
            localStorage.setItem('lastViewedNewsId', id); // 記住當前閱讀的新聞 ID

            const data = getActiveNewsData(id);
            if (!data) return;
            
            document.getElementById('selected-badge').innerText = data.badge;
            document.getElementById('news-source-tag').innerText = data.source;
            document.getElementById('news-title').innerText = data.title;
            document.getElementById('news-body').innerHTML = data.body;

            const vocabTbody = document.getElementById('vocabulary-table-body');
            vocabTbody.innerHTML = '';
            data.vocab.forEach(item => {
                const kkHtml = item.kk ? `<br><span class="text-xs text-slate-500 font-normal">[${item.kk}]</span>` : '';
                const usageHtml = item.usage ? `<div class="text-xs text-indigo-600 font-medium mb-1 not-italic">💡 Usage: ${item.usage}</div>` : '';
                
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td class="py-3 px-3 font-semibold text-indigo-600 align-top">${item.en}${kkHtml}</td>
                    <td class="py-3 px-3 text-slate-700 align-top">${item.zh}</td>
                    <td class="py-3 px-3 text-slate-600 align-top">${item.jp}</td>
                    <td class="py-3 px-3 text-slate-500 italic align-top">${usageHtml}${item.ex}</td>
                `;
                vocabTbody.appendChild(row);
            });

            renderQuestions();
            renderAllQuestionsForPrint(data);

            document.getElementById('choice-screen').classList.add('hidden');
            document.getElementById('learning-screen').classList.remove('hidden');
            document.getElementById('step-indicator').innerText = `📌 第二步：英文閱讀與深度討論 (${data.badge})`;
            
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function renderQuestions() {
            const container = document.getElementById('questions-container');
            if (!container) return;
            container.innerHTML = '';
            
            const data = getActiveNewsData(currentNewsId);
            if (!data) return;
            
            const total = data.allQuestions.length;
            const questionsToShow = [];
            for (let i = 0; i < 3; i++) {
                const index = (currentQuestionStartIndex + i) % total;
                questionsToShow.push({
                    item: data.allQuestions[index],
                    displayNum: index + 1
                });
            }
            
            questionsToShow.forEach(({ item, displayNum }) => {
                const qCard = document.createElement('div');
                qCard.className = "p-4 bg-slate-50 rounded-xl border border-slate-200 space-y-3";
                qCard.innerHTML = `
                    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                        <div class="flex items-start space-x-3">
                            <span style="flex-shrink: 0; width: 1.75rem; height: 1.75rem; background: #e0e7ff; color: #4338ca; border-radius: 9999px; font-weight: 700; font-size: 0.75rem; display: flex; align-items: center; justify-content: center; margin-top: 0.125rem;">${displayNum}</span>
                            <p class="text-slate-800 font-medium text-sm md:text-base">${item.q}</p>
                        </div>
                    </div>
                    <div style="padding-left: 2.5rem;">
                        <button onclick="toggleAnswer(this)" class="text-xs font-medium text-indigo-600 hover:text-indigo-800 flex items-center space-x-1 bg-indigo-50 hover:bg-indigo-100 px-3 py-1.5 rounded-lg transition cursor-pointer no-print">
                            <i class="fa-regular fa-lightbulb"></i>
                            <span>查看參考答案 (Sample Answer)</span>
                        </button>
                        <div class="hidden mt-2 p-3 bg-white border border-indigo-100 rounded-lg text-xs md:text-sm text-slate-600 shadow-sm answer-content">
                            <span class="font-semibold text-indigo-600">💡 參考範例：</span> ${item.ans}
                        </div>
                    </div>
                `;
                container.appendChild(qCard);
            });
        }

        function renderAllQuestionsForPrint(data) {
            const container = document.getElementById('all-questions-print-container');
            if (!container) return;
            container.innerHTML = '';
            data.allQuestions.forEach((item, idx) => {
                const div = document.createElement('div');
                div.className = "p-3 bg-slate-50 rounded-lg border border-slate-200";
                div.innerHTML = `
                    <div class="flex items-start gap-3">
                        <span class="font-bold text-indigo-600 text-sm min-w-[2rem]">Q${idx+1}.</span>
                        <div>
                            <p class="text-slate-800 font-medium text-sm">${item.q}</p>
                            <p class="text-slate-600 text-sm mt-1"><span class="font-semibold text-indigo-600">💡 參考範例：</span> ${item.ans}</p>
                        </div>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        function toggleAnswer(btn) {
            const answerBox = btn.nextElementSibling;
            if (answerBox.classList.contains('hidden')) {
                answerBox.classList.remove('hidden');
                btn.innerHTML = `<i class="fa-solid fa-lightbulb" style="color: #d97706;"></i><span>隱藏參考答案</span>`;
            } else {
                answerBox.classList.add('hidden');
                btn.innerHTML = `<i class="fa-regular fa-lightbulb"></i><span>查看參考答案 (Sample Answer)</span>`;
            }
        }

        function regenerateQuestions(event) {
            const data = getActiveNewsData(currentNewsId);
            if (!data) return;
            
            currentQuestionStartIndex = (currentQuestionStartIndex + 3) % data.allQuestions.length;
            renderQuestions();
            
            const btn = event ? event.currentTarget : document.querySelector('button[onclick*="regenerateQuestions"]');
            if (btn) {
                const originalText = btn.innerHTML;
                btn.innerHTML = `<i class="fa-solid fa-check" style="color: #059669;"></i><span style="color: #059669;">已切換新題目！</span>`;
                setTimeout(() => { btn.innerHTML = originalText; }, 1500);
            }
        }

        // 返回主頁 (清除目前觀看記憶，但保留卡片列表)
        function resetToHome() {
            currentNewsId = null;
            localStorage.removeItem('lastViewedNewsId'); // 清除記憶
            document.getElementById('learning-screen').classList.add('hidden');
            document.getElementById('choice-screen').classList.remove('hidden');
            document.getElementById('step-indicator').innerText = "📌 第一步：閱讀 200-300 字中文摘要並選擇新聞";
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // AI 提示詞生成器 (更新：加入 KK 音標 + 簡單英文用法說明 + 至少 3 句高級參考答案要求)
        function copyAiPrompt(type) {
            const baseInstructions = "每篇新聞需包含：\n1. 200-300字中文摘要；\n2. 英文內文；\n3. 3 個核心單字，且單字物件必須包含 KK音標 (kk 欄位)、以簡單英文說明的用法說明 (usage 欄位) 與英文例句 (ex 欄位)；\n4. 10 題開放式討論題與高級參考答案。注意：開放式討論題的參考答案請寫得非常豐富高級，每題參考答案至少要包含 3 個完整的句子！\n請直接提供 JavaScript 陣列物件格式 (masterNewsPool)。";

            let promptText = "";
            if (type === 'general') {
                promptText = "請幫我生成 3 篇全新主題的 ESL 新聞題庫。\n" + baseInstructions;
            } else {
                let customTopic = prompt("請輸入今天想讓學生討論的主題或關鍵字：");
                if (!customTopic) return;
                promptText = `請以「${customTopic}」為主題，幫我生成 3 篇適合 ESL 學習的新聞題庫。\n` + baseInstructions;
            }

            navigator.clipboard.writeText(promptText).then(() => {
                alert("✅ AI 指令已複製到剪貼簿！請貼給 AI 發送。");
            }).catch(err => {
                console.error('複製失敗', err);
            });
        }

        function copyFullContent() {
            const data = getActiveNewsData(currentNewsId);
            if (!data) { alert('請先選擇一則新聞'); return; }

            let qaText = '';
            data.allQuestions.forEach((item, idx) => {
                qaText += `Q${idx+1}: ${item.q}\nA: ${item.ans}\n\n`;
            });

            const vocabRows = document.querySelectorAll('#vocabulary-table-body tr');
            let vocabText = '';
            vocabRows.forEach(row => {
                const cells = row.querySelectorAll('td');
                if (cells.length === 4) {
                    vocabText += `${cells[0].textContent.replace(/\n/g, ' ')} | ${cells[1].textContent.trim()} | ${cells[2].textContent.trim()} | ${cells[3].textContent.replace(/\n/g, ' ')}\n`;
                }
            });

            const fullText = 
`📰 新聞標題：${data.title}
🏷️ ${data.badge}  |  ${data.source}

${document.getElementById('news-body').textContent.trim()}

📚 核心單字解析：
${vocabText}

💬 開放式討論（全部 10 題）：
${qaText}

--- ESL News Talk 複製於 ${new Date().toLocaleString()} ---`;

            navigator.clipboard.writeText(fullText).then(() => {
                alert('✅ 全部內容（含新聞、單字、全部 10 題問答）已複製到剪貼簿！');
            }).catch(() => {
                alert('❌ 複製失敗，請手動選取複製。');
            });
        }

        function saveAsPDF() {
            window.print();
        }

        // 網頁載入時自動讀取上次紀錄
        window.onload = function() {
            renderNewsCards();
            const savedNewsId = localStorage.getItem('lastViewedNewsId');
            if (savedNewsId) {
                selectNews(parseInt(savedNewsId));
            }
        };
    </script>
</body>
</html>
