<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESL News Talk</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap');
        *, ::before, ::after { box-sizing: border-box; border-width: 0; border-style: solid; border-color: #e2e8f0; }
        html { line-height: 1.5; font-family: 'Plus Jakarta Sans', 'Noto Sans TC', sans-serif; background-color: #f8fafc; color: #1e293b; }
        body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; justify-content: space-between; }
        .hidden { display: none !important; }
        .max-w-4xl { max-width: 56rem; }
        .mx-auto { margin-left: auto; margin-right: auto; }
        .px-4 { padding-left: 1rem; padding-right: 1rem; }
        .py-4 { padding-top: 1rem; padding-bottom: 1rem; }
        .py-8 { padding-top: 2rem; padding-bottom: 2rem; }
        .mt-1 { margin-top: 0.25rem; }
        .mt-4 { margin-top: 1rem; }
        .mt-6 { margin-top: 1.5rem; }
        .mb-2 { margin-bottom: 0.5rem; }
        .mb-3 { margin-bottom: 0.75rem; }
        .ml-2 { margin-left: 0.5rem; }
        .space-x-2 > * + * { margin-left: 0.5rem; }
        .space-x-3 > * + * { margin-left: 0.75rem; }
        .space-y-4 > * + * { margin-top: 1rem; }
        .space-y-6 > * + * { margin-top: 1.5rem; }
        .space-y-8 > * + * { margin-top: 2rem; }
        .flex { display: flex; }
        .inline-flex { display: inline-flex; }
        .grid { display: grid; }
        .flex-col { flex-direction: column; }
        .items-center { align-items: center; }
        .justify-between { justify-content: space-between; }
        .flex-grow { flex-grow: 1; }
        .w-full { width: 100%; }
        .gap-4 { gap: 1rem; }
        .gap-6 { gap: 1.5rem; }
        .grid-cols-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
        .bg-white { background-color: #ffffff; }
        .bg-slate-50 { background-color: #f8fafc; }
        .bg-slate-100 { background-color: #f1f5f9; }
        .bg-indigo-50 { background-color: #eef2ff; }
        .bg-indigo-600 { background-color: #4f46e5; }
        .bg-indigo-700 { background-color: #4338ca; }
        .text-white { color: #ffffff; }
        .text-xs { font-size: 0.75rem; line-height: 1rem; }
        .text-sm { font-size: 0.875rem; line-height: 1.25rem; }
        .text-base { font-size: 1rem; line-height: 1.5rem; }
        .text-lg { font-size: 1.125rem; line-height: 1.75rem; }
        .text-xl { font-size: 1.25rem; line-height: 1.75rem; }
        .text-2xl { font-size: 1.5rem; line-height: 2rem; }
        .font-bold { font-weight: 700; }
        .font-semibold { font-weight: 600; }
        .font-medium { font-weight: 500; }
        .text-slate-400 { color: #94a3b8; }
        .text-slate-500 { color: #64748b; }
        .text-slate-600 { color: #475569; }
        .text-slate-700 { color: #334155; }
        .text-slate-800 { color: #1e293b; }
        .text-indigo-600 { color: #4f46e5; }
        .border { border-width: 1px; }
        .border-b { border-bottom-width: 1px; }
        .border-t { border-top-width: 1px; }
        .border-slate-200 { border-color: #e2e8f0; }
        .border-slate-300 { border-color: #cbd5e1; }
        .border-indigo-100 { border-color: #e0e7ff; }
        .rounded-xl { border-radius: 0.75rem; }
        .rounded-2xl { border-radius: 1rem; }
        .rounded-full { border-radius: 9999px; }
        .rounded-md { border-radius: 0.375rem; }
        .p-2 { padding: 0.5rem; }
        .p-4 { padding: 1rem; }
        .p-6 { padding: 1.5rem; }
        .p-8 { padding: 2rem; }
        .px-3 { padding-left: 0.75rem; padding-right: 0.75rem; }
        .py-2 { padding-top: 0.5rem; padding-bottom: 0.5rem; }
        .py-2\.5 { padding-top: 0.625rem; padding-bottom: 0.625rem; }
        .py-3 { padding-top: 0.75rem; padding-bottom: 0.75rem; }
        .sticky { position: sticky; }
        .top-0 { top: 0px; }
        .z-50 { z-index: 50; }
        .shadow-sm { box-shadow: 0 1px 2px 0 rgb(0 0 0 / 0.05); }
        .shadow-md { box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); }
        .cursor-pointer { cursor: pointer; }
        .transition { transition-property: color, background-color, border-color, text-decoration-color, fill, stroke, opacity, box-shadow, transform; transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1); transition-duration: 150ms; }
        .overflow-x-auto { overflow-x: auto; }
        .text-left { text-align: left; }
        .border-collapse { border-collapse: collapse; }
        .italic { font-style: italic; }
        .hover\:bg-slate-50:hover { background-color: #f8fafc; }
        .hover\:bg-indigo-700:hover { background-color: #4338ca; }
        .hover\:shadow-md:hover { box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); }
        @media (min-width: 768px) {
            .md\:block { display: block; }
            .md\:grid-cols-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
            .md\:text-3xl { font-size: 1.875rem; line-height: 2.25rem; }
            .md\:text-lg { font-size: 1.125rem; line-height: 1.75rem; }
            .md\:p-8 { padding: 2rem; }
            .sm\:flex-row { flex-direction: row; }
            .sm\:items-center { align-items: center; }
        }
        .save-toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 0.6rem;
            margin-top: 0.5rem;
            margin-bottom: 0.25rem;
        }
        .save-toolbar button {
            background: white;
            border: 1px solid #cbd5e1;
            padding: 0.4rem 1rem;
            border-radius: 40px;
            font-size: 0.75rem;
            font-weight: 600;
            color: #1e293b;
            box-shadow: 0 1px 2px rgba(0,0,0,0.03);
            transition: all 0.15s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }
        .save-toolbar button:hover {
            background: #f1f5f9;
            border-color: #94a3b8;
        }
        .save-toolbar button.primary {
            background: #4f46e5;
            border-color: #4f46e5;
            color: white;
        }
        .save-toolbar button.primary:hover {
            background: #4338ca;
        }
        @media print {
            .no-print { display: none !important; }
            body { background: white; }
            .bg-white { box-shadow: none !important; border: 1px solid #ddd; }
            .print-only { display: block !important; }
            .print-all-questions { display: block !important; }
        }
        .print-only { display: none; }
        .print-all-questions { display: none; }
        /* ===== iPad 全版面放大 ===== */
        html { font-size: clamp(17px, 2.05vw, 22px); -webkit-text-size-adjust: 100%; }
        .max-w-4xl { max-width: 58rem; }
        main.max-w-4xl { padding-left: 1rem; padding-right: 1rem; }
        @media (max-width: 600px) { html { font-size: 16px; } }
        .card-desc { font-size: 0.95rem; line-height: 1.75; }
        #news-title { font-size: 1.9rem; line-height: 1.3; }
        #news-body { font-size: 1.22rem !important; line-height: 1.85 !important; }
        #news-body p { position: relative; padding-left: 2.4rem; margin: 0 0 1.1rem 0; }
        #vocabulary-table-body { font-size: 1rem; }
        #vocabulary-table-body td { border-bottom: 1px solid #f1f5f9; }
        .q-text { font-size: 1.12rem !important; line-height: 1.6; }
        .answer-content { font-size: 1.02rem !important; line-height: 1.7; }

        /* ===== 發音 / 朗讀 ===== */
        .tts-bar { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 0.9rem; padding: 0.6rem 0.75rem; }
        .tts-bar button, .tts-bar select { font: inherit; font-size: 0.85rem; font-weight: 600; border-radius: 999px; border: 1px solid #cbd5e1; background: #fff; color: #1e293b; padding: 0.4rem 0.95rem; cursor: pointer; display: inline-flex; align-items: center; gap: 0.4rem; }
        .tts-bar button.play { background: #4f46e5; border-color: #4f46e5; color: #fff; }
        .tts-bar button.play:hover { background: #4338ca; }
        .tts-bar select { padding: 0.4rem 0.6rem; max-width: 15rem; }
        .tts-bar .tts-hint { font-size: 0.78rem; color: #64748b; flex-basis: 100%; }
        .para-play { position: absolute; left: 0; top: 0.25rem; width: 1.8rem; height: 1.8rem; border-radius: 999px; border: 1px solid #c7d2fe; background: #eef2ff; color: #4f46e5; font-size: 0.75rem; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0; }
        .para-play:hover { background: #e0e7ff; }
        .w { cursor: pointer; border-radius: 4px; transition: background 0.12s; -webkit-tap-highlight-color: transparent; }
        .w:hover { background: #e0e7ff; }
        .w.word-on { background: #fde68a; }
        .s.reading { background: #fef9c3; box-shadow: 0 0 0 2px #fef9c3; border-radius: 4px; }
        .say { border: none; background: #eef2ff; color: #4f46e5; width: 1.9rem; height: 1.9rem; border-radius: 999px; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; font-size: 0.8rem; vertical-align: middle; margin-left: 0.35rem; flex-shrink: 0; }
        .say:hover { background: #e0e7ff; }
        .say.sm { width: 1.55rem; height: 1.55rem; font-size: 0.68rem; }
        .vocab-word { font-size: 1.15rem; }
        .batch-dots { display: flex; gap: 0.35rem; align-items: center; }
        .batch-dots span { width: 0.6rem; height: 0.6rem; border-radius: 999px; background: #cbd5e1; cursor: pointer; }
        .batch-dots span.on { background: #4f46e5; width: 1.4rem; }
        .news-date { font-size: 0.75rem; color: #94a3b8; }
        @media print { .para-play, .say, .tts-bar { display: none !important; } #news-body p { padding-left: 0; } }
    </style>
</head>
<body>

    <!-- Header -->
    <header style="background: white; border-bottom: 1px solid #e2e8f0; position: sticky; top: 0; z-index: 50;" class="no-print">
        <div class="max-w-4xl mx-auto px-4 py-4 flex items-center justify-between">
            <div class="flex items-center space-x-3 cursor-pointer" onclick="resetToHome()">
                <div class="bg-indigo-600 text-white p-2 rounded-xl shadow-md">
                    <i class="fa-solid fa-newspaper text-xl"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold text-slate-800">ESL News Talk</h1>
                </div>
            </div>
            <div id="step-indicator" class="text-sm font-medium text-indigo-600 bg-indigo-50 px-3 py-1.5 rounded-full hidden md:block">
                📌 第一步：閱讀中文摘要並選擇新聞
            </div>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="max-w-4xl mx-auto px-4 py-8 w-full flex-grow space-y-8">

        <!-- AI Integration Control Panel Banner -->
        <section class="bg-indigo-50 border border-indigo-100 rounded-2xl p-4 shadow-sm flex flex-wrap gap-3 items-center justify-between no-print">
            <div class="flex items-center space-x-2 text-indigo-900 font-bold text-sm">
                <i class="fa-solid fa-robot text-indigo-600"></i>
                <span>AI 智慧生成與自訂主題</span>
            </div>
            <div class="flex flex-wrap gap-2">
                <button onclick="copyAiPrompt('general')" class="inline-flex items-center space-x-1.5 bg-indigo-600 hover:bg-indigo-700 text-white px-3 py-1.5 rounded-xl text-xs font-medium transition shadow-sm cursor-pointer">
                    <i class="fa-solid fa-wand-magic-sparkles"></i>
                    <span>複製隨機生成指令</span>
                </button>
                <button onclick="copyAiPrompt('custom')" class="inline-flex items-center space-x-1.5 bg-white hover:bg-slate-50 text-indigo-600 border border-indigo-200 px-3 py-1.5 rounded-xl text-xs font-medium transition shadow-sm cursor-pointer">
                    <i class="fa-solid fa-comment-dots"></i>
                    <span>複製指定主題指令</span>
                </button>
            </div>
        </section>

        <!-- SCREEN 1: Choice Screen -->
        <section id="choice-screen" class="space-y-6">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-2">
                <div>
                    <h2 class="text-2xl md:text-3xl font-bold text-slate-800">國際精選英文新聞</h2>
                    <div class="flex items-center mt-1" style="gap:0.75rem;flex-wrap:wrap;">
                        <span id="batch-label" class="text-sm text-slate-500"></span>
                        <div id="batch-dots" class="batch-dots no-print"></div>
                    </div>
                </div>
                <button onclick="refreshNewsPool(event)" class="inline-flex items-center justify-center space-x-2 bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2.5 rounded-xl font-medium text-sm transition shadow-sm cursor-pointer no-print">
                    <i class="fa-solid fa-rotate-right"></i>
                    <span>換下一批新聞 (3 篇)</span>
                </button>
            </div>
            <div class="grid gap-6 md:grid-cols-3" id="news-cards-container"></div>
        </section>

        <!-- SCREEN 2: Learning Screen -->
        <section id="learning-screen" class="hidden space-y-8">
            <!-- 返回 + 保存工具列 -->
            <div class="flex flex-wrap items-center justify-between gap-3 no-print">
                <button onclick="resetToHome()" class="inline-flex items-center text-sm font-medium text-slate-600 hover:text-indigo-600 transition bg-white px-4 py-2 rounded-xl border border-slate-200 shadow-sm cursor-pointer">
                    <i class="fa-solid fa-arrow-left mr-2"></i> 返回選擇其他新聞
                </button>
                <div class="save-toolbar">
                    <button onclick="copyFullContent()" class="primary"><i class="fa-regular fa-copy"></i> 複製全部內容 (含全部10題問答)</button>
                    <button onclick="saveAsPDF()"><i class="fa-regular fa-file-pdf"></i> 儲存為 PDF</button>
                </div>
            </div>

            <!-- English News Content -->
            <div class="bg-white rounded-2xl p-6 md:p-8 border border-slate-200 shadow-sm space-y-4" id="news-content-block">
                <div class="flex items-center justify-between">
                    <span id="selected-badge" class="text-xs font-semibold text-indigo-600 bg-indigo-50 px-3 py-1 rounded-full">新聞閱讀</span>
                    <span id="news-source-tag" class="text-xs font-medium text-slate-500 bg-slate-100 px-2.5 py-1 rounded-md">Source: BBC News</span>
                </div>
                <h2 id="news-title" class="text-2xl font-bold text-slate-800"></h2>
                <div class="tts-bar no-print">
                    <button class="play" onclick="readFrom(0)"><i class="fa-solid fa-volume-high"></i> 朗讀全文</button>
                    <button id="tts-pause" onclick="togglePause()"><i class="fa-solid fa-pause"></i> 暫停</button>
                    <button onclick="stopReading()"><i class="fa-solid fa-stop"></i> 停止</button>
                    <select onchange="setRate(this.value)" id="tts-rate" title="語速">
                        <option value="0.7">🐢 慢速 0.7</option>
                        <option value="0.8">語速 0.8</option>
                        <option value="0.9">語速 0.9</option>
                        <option value="1">正常 1.0</option>
                    </select>
                    <select id="tts-voice" onchange="setVoice(this.value)" title="選擇英文發音"><option>English voice</option></select>
                    <span class="tts-hint">👆 點任何一個英文單字就能聽發音；點段落左邊的 ▶ 從那一段開始唸。</span>
                </div>
                <div id="news-body" class="text-slate-700 leading-relaxed border-t border-slate-100 pt-4"></div>
            </div>

            <!-- Vocabulary Section (含 KK 音標與英文用法欄位) -->
            <div class="bg-white rounded-2xl p-6 md:p-8 border border-slate-200 shadow-sm space-y-6" id="vocab-block">
                <div class="flex items-center space-x-2">
                    <i class="fa-solid fa-book-open text-indigo-600"></i>
                    <h3 class="text-xl font-bold text-slate-800">核心關鍵字詞解析 (Vocabulary・5 個難詞)</h3>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="border-b border-slate-200 text-slate-400 text-xs font-semibold uppercase">
                                <th class="pb-3 px-3">英文 (English & KK音標) 🔊</th>
                                <th class="pb-3 px-3">中文解釋</th>
                                <th class="pb-3 px-3">日文解釋</th>
                                <th class="pb-3 px-3">英文用法說明 (Usage) & 例句</th>
                            </tr>
                        </thead>
                        <tbody id="vocabulary-table-body"></tbody>
                    </table>
                </div>
            </div>

            <!-- Questions Section -->
            <div class="bg-white rounded-2xl p-6 md:p-8 border border-slate-200 shadow-sm space-y-6" id="questions-block">
                <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 no-print">
                    <div class="flex items-center space-x-2">
                        <i class="fa-solid fa-comments text-indigo-600"></i>
                        <h3 class="text-xl font-bold text-slate-800">開放式討論問題庫 (顯示3題)</h3>
                    </div>
                    <button onclick="regenerateQuestions(event)" class="inline-flex items-center justify-center space-x-2 bg-indigo-50 hover:bg-indigo-100 text-indigo-600 px-4 py-2.5 rounded-xl font-medium text-sm transition cursor-pointer">
                        <i class="fa-solid fa-rotate"></i>
                        <span>換下一組 (3題)</span>
                    </button>
                </div>
                <div id="questions-container" class="space-y-4"></div>
                
                <!-- 列印時顯示全部10題 -->
                <div class="print-all-questions" style="margin-top: 2rem; border-top: 2px dashed #cbd5e1; padding-top: 1.5rem;">
                    <h4 class="text-lg font-bold text-slate-800 mb-4">📋 全部 10 題討論題庫</h4>
                    <div id="all-questions-print-container" class="space-y-3"></div>
                </div>
            </div>
        </section>

    </main>

    <!-- Footer (加入專屬版權宣告與年份) -->
    <footer style="background: white; border-top: 1px solid #e2e8f0; padding: 1.25rem 0; margin-top: 3rem;" class="no-print">
        <div class="max-w-4xl mx-auto px-4 text-center text-xs text-slate-400 space-y-1">
            <p>ESL News Talk &copy; 2026</p>
            <p class="font-medium text-slate-500">Shelleytaiwan製作2026</p>
        </div>
    </footer>

    <!-- Script Logic -->
    <script>
        const D = [];
D.push(
{
id: 1, date: "2026-10-01",
source: "Source: Breaking News English",
badge: "國際政治・能源",
cardTitle: "歐盟警告能源價格危機：請大家少用電、少用瓦斯",
cardDesc: "歐盟執委會能源委員約根森警告，歐洲正面臨「與供應危機相連的價格危機」，因為歐洲的天然氣儲存量只有 68%。他呼籲各國暫時降低用電和用氣量來穩住價格。最讓歐洲擔心的是柴油：農業、營建、航運、物流都靠它，柴油一漲，超市裡的食物也跟著漲。歐盟約一半的柴油進口來自美國，而川普總統最近說他「非常認真地」考慮禁止柴油出口。歐盟因此希望發展更多自產的乾淨能源，減少對進口石油和天然氣的依賴。",
title: "European Union Warns of an Energy Price Crisis",
body: `<p>Okay, so let's start with something that hits everyone's wallet: energy prices. The European Union is getting really worried. The EU's Energy Commissioner, a man called Dan Jorgensen, basically said, "We're facing a price crisis, and it's linked to a supply crisis." In simple words, there isn't enough energy to go around, so prices are shooting up.</p><p>What's his solution? He's asking countries, and really all of us, to just use less gas and electricity for a while. Here's a number that worries him: gas storage in Europe is only about 68 percent full, and winter is coming. He says any government help to control prices should be "well targeted" and "temporary", so not a blank cheque forever.</p><p>Now, the really big headache is diesel. Think about it: tractors on farms, trucks on the highway, ships, construction machines, they all run on diesel. So when diesel gets expensive, guess what? Your groceries get expensive too. Europe imports a lot of its diesel, and around half of those imports come from the USA. But last week, President Donald Trump said, "Let's not send out the diesel," and he's thinking about an export ban "very seriously". So European leaders are now saying, "We need to make more clean energy ourselves, so we don't depend so much on other countries for oil and gas."</p>`,
vocab: [
{ en: "commissioner", kk: "/kəˋmɪʃənɚ/", zh: "委員、專員", jp: "委員", usage: "A person given official power to be in charge of a certain area of government.", ex: "The energy commissioner gave a speech about rising prices." },
{ en: "temporary", kk: "/ˋtɛmpəˏrɛrɪ/", zh: "暫時的", jp: "一時的な", usage: "Lasting only for a short time, not forever.", ex: "This is just a temporary job until I find something better." },
{ en: "diesel", kk: "/ˋdizḷ/", zh: "柴油", jp: "軽油、ディーゼル燃料", usage: "A heavy fuel used in trucks, tractors, ships and some cars.", ex: "Most big trucks still run on diesel." },
{ en: "logistics", kk: "/loˋdʒɪstɪks/", zh: "物流", jp: "物流、ロジスティクス", usage: "The planning and moving of goods from one place to another.", ex: "My cousin works in logistics, so she knows how packages travel." },
{ en: "rely on", kk: "/rɪˋlaɪ ɑn/", zh: "依賴", jp: "〜に頼る", usage: "To need someone or something in order to survive or work properly.", ex: "Many islands rely on ships to bring in food." }

title: "What Coffee Really Does to Your Gut and Brain",
body: `<p>Coffee lovers, this one is for you. We all think coffee is just about caffeine, right? You drink it, you wake up, done. But a new study from University College Cork in Ireland says it's actually a lot more interesting than that. Coffee seems to talk to the tiny bacteria living in your gut, and those bacteria may affect your mood.</p><p>Here's how they did it. They took 62 people. Half of them were serious coffee drinkers, three to five cups a day, and the other half didn't drink coffee at all. The coffee drinkers had to stop for two whole weeks. Can you imagine? Then they started drinking coffee again, but some got regular coffee and some got decaf, and nobody knew which one they had.</p><p>The results? Both kinds of coffee made people feel less stressed, less depressed and less impulsive. Decaf actually helped with learning and memory, while regular coffee lowered anxiety and helped people focus. The researchers also found that certain gut bacteria increased in coffee drinkers. Professor John Cryan said, "Coffee is more than just caffeine. It's a complex dietary factor that interacts with our gut microbes, our metabolism, and even our emotional well-being." One small warning though: it was a small study, so we can't say coffee is magic just yet.</p>`,

title: "Australia Bans AI Songs from Official Music Charts",
body: `<p>Let's talk about music and AI, because this is a hot topic. In Australia, the group that runs the official music charts, it's called ARIA, has made a big decision. Songs that are made "wholly", meaning completely, by AI can no longer enter the official charts.</p><p>So what started all this? There was an AI version of Madonna's 1989 hit "Like a Prayer". This cover used a lot of AI technology, and guess what? It stayed in the Australian top 20 for 16 weeks! A lot of music fans and traditional musicians were not happy. They felt it wasn't fair to real human artists. Now, here's the important detail: songs that are only "AI-assisted", where a human is still doing most of the creative work and AI is just helping, are still allowed.</p><p>ARIA's boss, Annabelle Herd, said the charts need to protect artists and their income. She said AI has some good uses in music, but it shouldn't push humans out. And what about the guy who made the AI Madonna song? His name is Josh Fawaz. He admitted he used AI, but he called it a "tool", like a guitar or a computer. And surprisingly, he agreed with the decision. He said, "I understand that AI in music isn't for everyone and that's fine." So, the big question is: where's the line between a tool and a replacement?</p>`,

cardTitle: "不尊重峇里島「靜默日」，瑞士遊客被判刑一年",
cardDesc: "一名 26 歲的瑞士遊客在印尼峇里島被判一年徒刑，原因是他侮辱了當地重要的印度教節日「Nyepi」，也就是「靜默日」。這一天全島保持安靜，從早上 6 點到隔天早上 6 點，人們待在家裡、禁食和冥想，工作、交通和娛樂都停止，機場關閉，網路也受限，只有傳統的保安人員可以在外巡邏。這名遊客卻跑到空無一人的海灘拍影片，還用粗話說這份寂靜「太瘋狂」，影片上傳後引起當地社群憤怒。法官認為他傷害了宗教感情。遊客表示自己不了解靜默日的意義，並「深感後悔」。",
title: "Bali Jails Tourist for Not Respecting the Day of Silence",
body: `<p>This story is a good reminder for all of us who love to travel. In Bali, Indonesia, a 26-year-old tourist from Switzerland has been sent to jail for one year. What did he do? He disrespected a very important Hindu festival called Nyepi, or in English, the Day of Silence.</p><p>So what is the Day of Silence? It's a really special, sacred day for Hindus in Bali, and it's been celebrated for centuries. For 24 hours, from 6 a.m. one day until 6 a.m. the next day, the whole island goes quiet. People stay at home, they fast, and they meditate. No work, no travel, no parties. Even the airport closes, and the internet is limited! Only traditional security guards are allowed outside to make sure everyone follows the rules.</p><p>But this tourist went outside anyway. He went to an empty beach and filmed himself. And in the video, he used bad language and called the silence "crazy". Then he posted it on social media. You can imagine how the local people felt. They were really upset, and he was arrested. The judge said he hurt people's religious feelings. The tourist said he didn't understand how important Nyepi was, and he didn't mean to disrespect anyone. He expressed "deep regret". So, the lesson? Before you travel, learn a little about local customs!</p>`,

cardTitle: "中世紀合葬墓不是一家人？古代 DNA 揭開意外真相",
cardDesc: "瑞典斯德哥爾摩大學的研究團隊分析了瑞典三個中世紀墓地、共 142 人的古代 DNA，其中包括 60 多名兒童和青少年。考古學家過去一直以為，大人和小孩葬在同一個墓裡，一定是父母子女或近親。但 DNA 顯示，他們「通常不是同一個核心家庭的成員」。研究人員還發現，兒童在死後也和成年男女一樣，依照相同的社會和宗教原則被埋葬。另外，一位被稱為「56 號女士」的女性和一枚扇貝殼一起下葬，扇貝殼是西班牙聖地牙哥朝聖之路的象徵，代表她可能完成了中世紀歐洲最有名的朝聖之旅，回家後不到 30 歲就過世了。",
title: "Medieval Graves Looked Like Families, but DNA Said No",
body: `<p>Here's a little mystery from history. In medieval Sweden, about 700 or 800 years ago, people were sometimes buried together in the same grave: an adult and a child, side by side. And for a long time, archaeologists just assumed, "Oh, that must be a mother and her child, or a father and his son." Makes sense, right? Well, DNA has a different story to tell.</p><p>Researchers from Stockholm University studied ancient DNA from 142 people buried at three different sites in Sweden. More than 60 of them were children and teenagers. The lead author, Maja Krzewińska, said, "We often assume that adults and children sharing a grave were parents and children or other close family members. In most cases, that was not what we found." So, in most cases, they weren't close family at all!</p><p>So why were they buried together? We don't know exactly. Maybe they died at the same time, maybe they were neighbours, or maybe it was just how things were done. The study also found that children were buried following the same social and religious rules as adults. And there's one more cool detail: one woman, called "Lady 56", was buried with a scallop shell. That shell is a symbol of the famous pilgrimage to Santiago de Compostela in Spain. So she may have walked all the way there and back, and she died before she was 30. What a life!</p>`,

{ en: "medieval", kk: "/ˏmidɪˋivḷ/", zh: "中世紀的", jp: "中世の", usage: "From the Middle Ages, roughly the years 500 to 1500 in Europe.", ex: "We visited a medieval castle in Scotland." },

cardDesc: "日本漫畫和動畫風靡全球，《航海王》、《火影忍者》、《七龍珠》在世界各地都有大批粉絲。現在，沙烏地阿拉伯和法國計畫在巴黎附近建造一座以《七龍珠 Z》為主題的樂園，預算約 70 億美元，需要好幾年才能完工，將成為歐洲最大的遊樂園之一。這個構想始於 2024 年沙烏地王儲穆罕默德・本・沙爾曼和法國總統馬克宏會面時，兩人發現彼此都熱愛漫畫和《七龍珠 Z》。這座樂園預計為法國創造 2 萬 2000 個工作機會，也能幫助沙烏地減少對石油的依賴；園區還將包含 5 萬平方公尺的生物多樣性綠地。法國政府稱這是「迪士尼樂園等級的計畫」。",
title: "France and Saudi Arabia Plan a Dragon Ball Z Theme Park",
body: `<p>Anime fans, get ready, because this is big news. You probably know that Japanese manga and anime are popular everywhere: One Piece, Naruto, Dragon Ball. Now, two countries you might not expect, Saudi Arabia and France, are planning a theme park based on Dragon Ball Z. And they're going to build it near Paris!</p><p>This is not a small project. It's going to cost around 7 billion US dollars, it'll take several years to build, and it'll be one of the biggest amusement parks in Europe. A French government spokesperson even called it "a project on the scale of Disneyland". So how did it start? Here's the fun part. In 2024, Saudi Arabia's Crown Prince Mohammed bin Salman met French President Emmanuel Macron, and they discovered they were both fans of manga and Dragon Ball Z. Imagine two world leaders chatting about Goku!</p><p>Both countries should benefit. The park is expected to create 22,000 jobs in France. And for Saudi Arabia, it's part of a plan to depend less on oil. They've been investing a lot in tourism, entertainment and sports. Macron says the park will be "a new global destination". And it'll be green too: the plans include 50,000 square metres of green spaces for nature and biodiversity. Would you go? I'd want to try a Kamehameha ride!</p>`,

cardTitle: "極端高溫對 60 歲以上的人更危險，風險被嚴重低估",
cardDesc: "美國史丹佛大學的研究指出，年長者身體對高溫的耐受力會變差，全球持續升溫可能讓 60 歲以上的人面臨嚴重的生病甚至死亡風險，而這個威脅過去被嚴重低估。研究人員說，熱浪將讓數百萬年長者面臨「無法代償的熱壓力」，也就是身體失去自我降溫的能力。年長者風險較高有三個原因：流汗變少、心臟在高溫下要更費力工作、血管擴張得比較慢。英國慈善機構 Age UK 的主管表示研究結論令人擔憂：「現在已無法否認，極端高溫對年長者構成真正的健康威脅。」低收入國家的長者風險最高。",
title: "Extreme Heat Is More Dangerous for People Over 60",
body: `<p>Summers are getting hotter, we all feel it. But according to a new study, the heat is much more dangerous for older people than doctors used to think. Researchers from Stanford University in the USA say that as we get older, our bodies get worse at dealing with heat. And with global temperatures still rising, people aged 60 and over could face a serious risk of getting sick, or even dying.</p><p>The researchers say heatwaves will put millions of older people at risk of something called "uncompensable heat stress". That's a long name, but the idea is simple: it's when your body can't cool itself down anymore. And that can cause serious damage.</p><p>So why are older people at higher risk? There are three main reasons. First, they sweat less, and sweat is how we cool down. Second, their hearts have to work harder in the heat. And third, their blood vessels open up more slowly, which also makes cooling down harder. A director at the charity Age UK said the results were "alarming". She said, "There's now no denying that extreme heat poses a very real health threat to our older population." And the people at the highest risk? Elderly people in low-income countries, who may not have air conditioning. So, maybe this summer, check on your grandparents and older neighbours!</p>`,

title: "The Secret to Growing Food on Mars Could Be Fungi",
body: `<p>Let's imagine the future for a minute. One day, people might live on the Moon or on Mars. But there's a big problem: what are they going to eat? You can't just order pizza from Earth. They'll need to grow their own food. And the soil there, scientists call it "regolith", is really bad for plants. It's dusty, rocky, and it doesn't have the nutrients plants need, like nitrogen, potassium and phosphorus.</p><p>So scientists from the USA and Brazil looked at a possible solution, and it's a surprising one: fungi. Yes, the same family as mushrooms! There's a special type called arbuscular mycorrhizal fungi. Don't worry, you don't have to remember that name! These fungi work like an extension of a plant's roots. They connect to the roots and help the plant pull more water and nutrients out of the ground, even in tough conditions.</p><p>The researchers wrote that adding these helpful fungi to Moon or Mars farms "would present a strategic enhancement to space crop production." In simple words: fungi could be a game-changer for space farming. But they also said there's more work to do. So far, most tests used fake "space soil" made on Earth. Next, they need to test with real soil from the Moon and Mars. So, the first Martian salad might need a little help from some tiny underground friends!</p>`,

title: "Influencers Risk Shark Bites for the Perfect Photo",

title: "Sustainable Development Goals Not on Track, Says UN",
body: `<p>Back in 2015, the countries of the United Nations made a big promise to the world. They agreed on something called the Sustainable Development Goals, or SDGs for short. Maybe you've seen the colourful square logos. The goals are things like ending poverty, giving everyone a good education, making men and women more equal, and fighting climate change. And the deadline is 2030. That's only a few years away!</p><p>So, how's it going? Not great, says the UN. Only about one third of the goals are on track. Around half are moving too slowly. Why? There are lots of reasons: wars, climate change, slow economies, rising debt, not enough money, and other big global shocks. The UN is asking countries to try a lot harder before 2030.</p><p>But it's not all bad news. There's real progress too. One billion more people now have clean drinking water. And think about the internet: in 2015, only about 40 percent of people in the world were online. Now it's about 74 percent. That's huge! But gender equality is a big problem. A UN spokesperson said, "At the current rate of progress, gender equality would take 171 years to achieve." 171 years! So the UN says the goals are still possible, but only if everyone moves much faster.</p>`,

title: "Couples Who Exercise Together Communicate Better",
body: `<p>Okay, here's some good news for couples, and maybe a reason to drag your partner to the gym. New research says that married couples who exercise together communicate better.</p><p>Researchers from Brigham Young University in the USA studied 1,693 young married couples. They looked at their exercise habits and their relationships. In particular, they looked at things like: How do they solve arguments? Do they really listen to each other? And how often do they have serious problems?</p><p>Here's what they found. Exercise in general was good for marriages, whether people exercised alone or together. But couples who exercised together were better at solving their problems. One of the researchers, Professor Jeremy Yorgason, said exercising together helped couples sort out problems "peacefully". He was honest that the effect was small, but it was clear and very consistent across all the couples. And here's an interesting number: about 60 percent of the husbands and wives said they exercised, but only about a third exercised together. So, as he said, "about half the people who exercise are not exercising with their spouse." So maybe this weekend, instead of a movie date, try a hiking date or a bike ride together. You might have a better conversation, and fewer arguments!</p>`,

        function buildReadableBody(html) {
            const tmp = document.createElement('div');
            tmp.innerHTML = html;
            let sIdx = 0, out = '';
            tmp.querySelectorAll('p').forEach(p => {
                const text = p.textContent.trim();
                const sentences = text.split(/(?<=[.!?]["”’']?)\s+(?=["“‘']?[A-Z0-9])/);
                const startIdx = sIdx;
                const inner = sentences.map(s => {
                    const words = s.split(/\s+/).map(w => `<span class="w">${w.replace(/</g, '&lt;')}</span>`).join(' ');
                    return `<span class="s" data-s="${sIdx++}">${words}</span>`;
                }).join(' ');
                out += `<p><button class="para-play no-print" title="從這段開始朗讀" onclick="readFrom(${startIdx})"><i class="fa-solid fa-play"></i></button>${inner}</p>`;
            });
            return out;
        }

        // =========================================================
        //  主頁卡片（21 篇分 7 批，每批 3 篇，依序輪替）
        // =========================================================
        function renderNewsCards() {
            const container = document.getElementById('news-cards-container');
            if (!container) return;
            container.innerHTML = '';
            const start = currentBatch * BATCH_SIZE;
            masterNewsPool.slice(start, start + BATCH_SIZE).forEach((item, idx) => {
                const card = document.createElement('div');
                card.className = "bg-white rounded-2xl p-6 border border-slate-200 shadow-sm hover:shadow-md hover:border-indigo-300 transition cursor-pointer flex flex-col justify-between";
                card.onclick = () => selectNews(item.id);
                card.innerHTML = `
                    <div>
                        <div class="flex items-center justify-between mb-3" style="gap:0.5rem;flex-wrap:wrap;">
                            <span class="text-xs font-semibold text-indigo-600 bg-indigo-50 px-2.5 py-1 rounded-md">#${start + idx + 1}・${item.badge}</span>
                            <span class="news-date">${item.date}</span>
                        </div>
                        <h3 class="font-bold text-lg text-slate-800 mb-2">${item.cardTitle}</h3>
                        <p class="card-desc text-slate-600" style="text-align: justify;">${item.cardDesc}</p>
                        <p class="text-xs text-slate-400 mt-4">${item.source}</p>
                    </div>
                    <div class="mt-6 pt-4 border-t border-slate-100 flex items-center justify-between text-sm font-medium text-indigo-600">
                        <span>進入英文原文與討論</span>
                        <i class="fa-solid fa-arrow-right ml-2"></i>
                    </div>
                `;
                container.appendChild(card);
            });
            const label = document.getElementById('batch-label');
            if (label) label.innerText = `第 ${currentBatch + 1} / ${TOTAL_BATCHES} 批・共 ${masterNewsPool.length} 篇`;
            const dots = document.getElementById('batch-dots');
            if (dots) {
                dots.innerHTML = '';
                for (let i = 0; i < TOTAL_BATCHES; i++) {
                    const d = document.createElement('span');
                    if (i === currentBatch) d.className = 'on';
                    d.title = `第 ${i + 1} 批`;
                    d.onclick = () => { currentBatch = i; lsSet('newsBatch21', i); renderNewsCards(); };
                    dots.appendChild(d);
                }
            }
        }

        function refreshNewsPool(event) {
            currentBatch = (currentBatch + 1) % TOTAL_BATCHES;
            lsSet('newsBatch21', currentBatch);
            renderNewsCards();
            const btn = event ? event.currentTarget : null;
            if (btn) {
                const originalHTML = btn.innerHTML;
                btn.innerHTML = `<i class="fa-solid fa-check"></i><span>已換新！</span>`;
                setTimeout(() => { btn.innerHTML = originalHTML; }, 1200);
            }
        }

        function getActiveNewsData(id) {
            return masterNewsPool.find(n => n.id === id) || masterNewsPool[0];
        }

        // =========================================================
        //  閱讀頁
        // =========================================================
        function selectNews(id) {
            stopReading();
            currentNewsId = id;
            currentQuestionStartIndex = 0;
            lsSet('lastViewedNewsId21', id);

            const data = getActiveNewsData(id);
            if (!data) return;

            document.getElementById('selected-badge').innerText = data.badge;
            document.getElementById('news-source-tag').innerText = `${data.source}・${data.date}`;
            document.getElementById('news-title').innerText = data.title;
            document.getElementById('news-body').innerHTML = buildReadableBody(data.body);

            const vocabTbody = document.getElementById('vocabulary-table-body');
            vocabTbody.innerHTML = '';
            data.vocab.forEach(item => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td class="py-3 px-3 align-top" style="min-width: 9rem;">
                        <div class="flex items-center" style="flex-wrap:wrap;">
                            <span class="vocab-word font-semibold text-indigo-600">${item.en}</span>
                            <button class="say no-print" title="唸單字" onclick="speakText('${item.en.replace(/'/g, "\\'")}', 0.8)"><i class="fa-solid fa-volume-high"></i></button>
                        </div>
                        <span class="text-sm text-slate-500 font-normal">KK [${item.kk.replace(/^\/|\/$/g, '')}]</span>
                    </td>
                    <td class="py-3 px-3 text-slate-700 align-top">${item.zh}</td>
                    <td class="py-3 px-3 text-slate-600 align-top">${item.jp}</td>
                    <td class="py-3 px-3 text-slate-500 align-top">
                        <div class="text-indigo-600 font-medium mb-1" style="font-size:0.92rem;">💡 Usage: ${item.usage}</div>
                        <div class="italic">${item.ex}<button class="say sm no-print" title="唸例句" onclick="speakText(this.parentNode.firstChild.textContent)"><i class="fa-solid fa-volume-high"></i></button></div>
                    </td>
                `;
                vocabTbody.appendChild(row);
            });

            renderQuestions();
            renderAllQuestionsForPrint(data);

            document.getElementById('choice-screen').classList.add('hidden');
            document.getElementById('learning-screen').classList.remove('hidden');
            document.getElementById('step-indicator').innerText = `📌 第二步：聽讀英文新聞與深度討論 (${data.badge})`;
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // 點內文單字 → 發音（事件委派）
        document.addEventListener('click', e => {
            const w = e.target.closest && e.target.closest('#news-body .w');
            if (w) sayWord(w);
        });

        function renderQuestions() {
            const container = document.getElementById('questions-container');
            if (!container) return;
            container.innerHTML = '';
            const data = getActiveNewsData(currentNewsId);
            if (!data) return;

            const total = data.allQuestions.length;
            for (let i = 0; i < 3; i++) {
                const index = (currentQuestionStartIndex + i) % total;
                const item = data.allQuestions[index];
                const qCard = document.createElement('div');
                qCard.className = "p-4 bg-slate-50 rounded-xl border border-slate-200 space-y-3";
                qCard.innerHTML = `
                    <div class="flex items-start" style="gap:0.75rem;">
                        <span style="flex-shrink: 0; width: 2rem; height: 2rem; background: #e0e7ff; color: #4338ca; border-radius: 9999px; font-weight: 700; font-size: 0.85rem; display: flex; align-items: center; justify-content: center; margin-top: 0.125rem;">${index + 1}</span>
                        <p class="q-text text-slate-800 font-medium" style="margin:0;flex:1;">${item.q}</p>
                        <button class="say no-print" title="唸題目" data-say="q"><i class="fa-solid fa-volume-high"></i></button>
                    </div>
                    <div style="padding-left: 2.75rem;">
                        <button onclick="toggleAnswer(this)" class="text-sm font-medium text-indigo-600 flex items-center space-x-1 bg-indigo-50 px-3 py-1.5 rounded-lg transition cursor-pointer no-print">
                            <i class="fa-regular fa-lightbulb"></i>
                            <span>查看參考答案 (Sample Answer)</span>
                        </button>
                        <div class="hidden mt-2 p-3 bg-white border border-indigo-100 rounded-lg text-slate-600 shadow-sm answer-content">
                            <span class="font-semibold text-indigo-600">💡 參考範例：</span> <span class="ans-text">${item.ans}</span>
                            <button class="say sm no-print" title="唸參考答案" data-say="a"><i class="fa-solid fa-volume-high"></i></button>
                        </div>
                    </div>
                `;
                qCard.querySelector('[data-say="q"]').onclick = () => speakText(item.q);
                qCard.querySelector('[data-say="a"]').onclick = () => speakText(item.ans);
                container.appendChild(qCard);
            }
        }

        function renderAllQuestionsForPrint(data) {
            const container = document.getElementById('all-questions-print-container');
            if (!container) return;
            container.innerHTML = '';
            data.allQuestions.forEach((item, idx) => {
                const div = document.createElement('div');
                div.className = "p-3 bg-slate-50 rounded-lg border border-slate-200";
                div.innerHTML = `
                    <div class="flex items-start gap-3">
                        <span class="font-bold text-indigo-600 text-sm" style="min-width:2rem;">Q${idx + 1}.</span>
                        <div>
                            <p class="text-slate-800 font-medium text-sm" style="margin:0;">${item.q}</p>
                            <p class="text-slate-600 text-sm mt-1" style="margin-bottom:0;"><span class="font-semibold text-indigo-600">💡 參考範例：</span> ${item.ans}</p>
                        </div>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        function toggleAnswer(btn) {
            const answerBox = btn.nextElementSibling;
            if (answerBox.classList.contains('hidden')) {
                answerBox.classList.remove('hidden');
                btn.innerHTML = `<i class="fa-solid fa-lightbulb" style="color: #d97706;"></i><span>隱藏參考答案</span>`;
            } else {
                answerBox.classList.add('hidden');
                btn.innerHTML = `<i class="fa-regular fa-lightbulb"></i><span>查看參考答案 (Sample Answer)</span>`;
            }
        }

        function regenerateQuestions(event) {
            const data = getActiveNewsData(currentNewsId);
            if (!data) return;
            currentQuestionStartIndex = (currentQuestionStartIndex + 3) % data.allQuestions.length;
            renderQuestions();
            const btn = event ? event.currentTarget : null;
            if (btn) {
                const originalText = btn.innerHTML;
                btn.innerHTML = `<i class="fa-solid fa-check" style="color: #059669;"></i><span style="color: #059669;">已切換新題目！</span>`;
                setTimeout(() => { btn.innerHTML = originalText; }, 1500);
            }
        }

        function resetToHome() {
            stopReading();
            currentNewsId = null;
            lsDel('lastViewedNewsId21');
            document.getElementById('learning-screen').classList.add('hidden');
            document.getElementById('choice-screen').classList.remove('hidden');
            document.getElementById('step-indicator').innerText = "📌 第一步：閱讀中文摘要並選擇新聞";
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // AI 提示詞生成器
        function copyAiPrompt(type) {
            const baseInstructions = "每篇新聞需包含：\n1. 150-200 字中文摘要 (cardDesc)；\n2. 約 200-250 字的英文內文 (body)，用老師在課堂上「說」新聞的口語語氣改寫，句子簡短自然，分 3 段 <p>；\n3. 5 個較難的核心單字，每個單字物件包含 en、kk (KK音標)、zh、jp、usage (簡單英文用法說明)、ex (英文例句)；\n4. 10 題開放式討論題與口語化參考答案（每題 2-3 句）。討論題不要問「你覺得 X 重要嗎？」這種不用思考的題目，而要從主題延伸到學生的生活經驗、假設情境、選擇題式兩難、投資/設計/發明等有趣角度，看似和主題沒有直接關係卻又相關（例如環保新聞 → 如果你有錢會投資資源回收嗎？你曾經 DIY 嗎？）。\n每篇另需 id、date、source、badge、cardTitle、title 欄位。\n請直接提供 JavaScript 陣列物件格式 (masterNewsPool)。";
            let promptText = "";
            if (type === 'general') {
                promptText = "請從 breakingnewsenglish.com 或最新的世界新聞中，挑選 3 篇最新、話題多元（研究、健康、食衣住行、奇人異事、國際政治等）的新聞，製作 ESL 會話課新聞題庫。\n" + baseInstructions;
            } else {
                let customTopic = prompt("請輸入今天想讓學生討論的主題或關鍵字：");
                if (!customTopic) return;
                promptText = `請以「${customTopic}」為主題，挑選 3 篇最新的真實新聞，製作適合 ESL 會話課的新聞題庫。\n` + baseInstructions;
            }
            navigator.clipboard.writeText(promptText).then(() => {
                alert("✅ AI 指令已複製到剪貼簿！請貼給 AI 發送。");
            }).catch(() => { alert('❌ 複製失敗'); });
        }

        function copyFullContent() {
            const data = getActiveNewsData(currentNewsId);
            if (!data) { alert('請先選擇一則新聞'); return; }
            let qaText = '';
            data.allQuestions.forEach((item, idx) => { qaText += `Q${idx + 1}: ${item.q}\nA: ${item.ans}\n\n`; });
            let vocabText = '';
            data.vocab.forEach(v => { vocabText += `${v.en} [${v.kk}] | ${v.zh} | ${v.jp} | Usage: ${v.usage} 例: ${v.ex}\n`; });
            const bodyText = Array.from(document.querySelectorAll('#news-body p')).map(p => p.textContent.trim()).join('\n\n');
            const fullText =
`📰 新聞標題：${data.title}
🏷️ ${data.badge}  |  ${data.source}  |  ${data.date}

${bodyText}

📚 核心單字解析：
${vocabText}
💬 開放式討論（全部 10 題）：
${qaText}
--- ESL News Talk 複製於 ${new Date().toLocaleString()} ---`;
            navigator.clipboard.writeText(fullText).then(() => {
                alert('✅ 全部內容（含新聞、單字、全部 10 題問答）已複製到剪貼簿！');
            }).catch(() => { alert('❌ 複製失敗，請手動選取複製。'); });
        }

        function saveAsPDF() { stopReading(); window.print(); }

        window.onload = function () {
            const b = parseInt(lsGet('newsBatch21'));
            currentBatch = (b >= 0 && b < TOTAL_BATCHES) ? b : 0;
            renderNewsCards();
            const savedNewsId = parseInt(lsGet('lastViewedNewsId21'));
            if (savedNewsId && masterNewsPool.some(n => n.id === savedNewsId)) selectNews(savedNewsId);
        };
        (function(){ const r=document.getElementById('tts-rate'); if(r) r.value=String(TTS.rate); })();
    </script>
</body>
</html>
